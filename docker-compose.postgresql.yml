version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-app
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=production
      - DOCKER=true
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=Belorus2010
      - DB_NAME=platform          
      - DB_SYNCHRONIZE=true
      - DB_LOGGING=true
      - DB_RETRY_ATTEMPTS=10
      - DB_RETRY_DELAY=5000
      - DB_AUTO_LOAD_ENTITIES=true
      - DB_MIGRATIONS_RUN=false
      - DB_SSL=false
      - MONGO_URL=mongodb://mongo:27017/eventstore
      - JWT_SECRET=your-secret-key
      - CODE_EXEC_TEMP_DIR=/tmp/code_execution
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - code_exec_tmp:/tmp/code_execution
    depends_on:
      - postgres
      - mongo
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5433:5432"   
    environment:
      POSTGRES_DB: platform       
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Belorus2010
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27018:27017"  
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  code_exec_tmp: